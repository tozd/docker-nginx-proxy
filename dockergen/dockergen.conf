# With a config file, docker-gen 0.16.0 and newer ignore onlyexposed and include stopped containers,
# so container filters are set explicitly as well. Older versions ignore container filters.

[[config]]
watch = true
onlyexposed = true
notifycmd = "/usr/sbin/nginx -s reload"
template = "/dockergen/nginx.tmpl"
dest = "/etc/nginx/sites-enabled/zzz-virtual.conf"

[config.ContainerFilter]
status = ["running"]
expose = ["1-65535"]

[[config]]
watch = true
notifycmd = "pkill -HUP -P 1 dnsmasq || true"
template = "/dockergen/hosts.tmpl"
dest = "/etc/hosts.extra"

[config.ContainerFilter]
status = ["running"]

[[config]]
watch = true
onlyexposed = true
notifycmd = "/letsencrypt/dockergen.sh"
notifyoutput = true
template = "/dockergen/letsencrypt.tmpl"
dest = "/ssl/letsencrypt.list"

[config.ContainerFilter]
status = ["running"]
expose = ["1-65535"]
